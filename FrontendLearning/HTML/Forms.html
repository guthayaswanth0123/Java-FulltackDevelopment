
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Placement Registration Form</h1>
    <form>
        <div>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" placeholder="First Name">
        </div>
        <br>
        <div>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" placeholder="Last Name">
        </div>
        <br>
        <div>
            <label for="email_id">Email ID:</label>
            <input type="email" id="email_id" name="email" placeholder="Enter Your Email ID">
        </div>
        <br>
        <div>
            <label for="sbranch">Student Branch:</label>
            <select id="sbranch" name="branch">
                <option value="">Select Branch</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MCA">MCA</option>
            </select>
        </div>
        <br>
        <div>
            <label for="finalYear">Student Final Year</label>
            <input type="radio" name="finalYear" id="finalYear_yes" value="Yes">Yes
            <input type="radio" name="finalYear" id="finalYear_NO" value="No">No
        </div>
        <button type="submit">Register</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
